<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App – store2-dom</title>
        <link rel="stylesheet" href="../../styles/demo.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>✅ Todo App</h1>
            <p>Choose implementation:</p>
            <div class="version-switcher">
                <button id="btn-computed" class="active">Computed version</button>
                <button id="btn-reactive">Reactive (optimized) version</button>
                <button id="btn-deep">Deep version</button>
            </div>

            <!-- The app container – will be populated by the selected script -->
            <div id="app-root"></div>

            <p><a href="../../index.html">← Back to Demos</a></p>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "@supercat1337/store2": "../../../node_modules/@supercat1337/store2/dist/store2.esm.bundle.js",
                    "@supercat1337/store2-deep": "../../../node_modules/@supercat1337/store2-deep/dist/store2-deep.esm.js",
                    "@supercat1337/store2-dom": "../../../dist/store2-dom.esm.js"
                }
            }
        </script>
        <script type="module">
            import { renderComputed } from './main-computed.js';
            import { renderReactive } from './main-reactive.js';
            import { renderDeep } from './main-deep.js';

            const appRoot = document.getElementById('app-root');
            let currentRender = renderComputed;

            function render() {
                appRoot.innerHTML = '';
                const app = currentRender();
                appRoot.appendChild(app);
            }

            document.getElementById('btn-computed').addEventListener('click', () => {
                document
                    .querySelectorAll('.version-switcher button')
                    .forEach(b => b.classList.remove('active'));
                document.getElementById('btn-computed').classList.add('active');
                currentRender = renderComputed;
                render();
            });

            document.getElementById('btn-reactive').addEventListener('click', () => {
                document
                    .querySelectorAll('.version-switcher button')
                    .forEach(b => b.classList.remove('active'));
                document.getElementById('btn-reactive').classList.add('active');
                currentRender = renderReactive;
                render();
            });

            document.getElementById('btn-deep').addEventListener('click', () => {
                document
                    .querySelectorAll('.version-switcher button')
                    .forEach(b => b.classList.remove('active'));
                document.getElementById('btn-deep').classList.add('active');
                currentRender = renderDeep;
                render();
            });

            // Initial render
            render();
        </script>
    </body>
</html>
